<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Users & Reviews — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head><body>
<div class="layout-dash">
  <div id="side"></div>
  <main class="dash-main">
    <div class="dash-head"><h2>Users & review moderation</h2></div>

    <h3 class="mb-2">Users</h3>
    <div class="table-wrap mb-2">
      <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="ub"></tbody></table>
    </div>

    <h3 class="mt-4 mb-2">Flagged reviews</h3>
    <div id="rv" class="grid grid-2"></div>
  </main>
</div>
<script src="/js/app.js"></script><script src="/js/panel.js"></script>
<script>
  document.getElementById('side').innerHTML = dashLayout('admin','users');
  (async()=>{
    const [users,reviews] = await Promise.all([api('/users'),api('/reviews')]);
    document.getElementById('ub').innerHTML = users.map(u=>`
      <tr><td><strong>${u.name}</strong></td><td>${u.email}</td>
      <td><span class="badge badge-muted">${u.role}</span></td>
      <td><span class="badge ${u.status==='active'?'badge-success':'badge-danger'}">${u.status}</span></td>
      <td><div class="flex">
        ${u.status==='active'?'<button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="toast(\'User banned\',\'error\')">Ban</button>':'<button class="btn btn-success btn-sm" onclick="toast(\'Unbanned\',\'success\')">Unban</button>'}
        <button class="btn btn-ghost btn-sm">View</button></div></td></tr>`).join('');
    const flagged = reviews.filter(r=>r.flagged);
    document.getElementById('rv').innerHTML = flagged.length?flagged.map(r=>`
      <div class="card"><div class="card-body">
        <div class="flex between"><strong>${r.user}</strong><span class="rating">★ ${r.rating}</span></div>
        <p class="mt-2" style="color:var(--muted)">${r.comment}</p>
        <div class="flex mt-2"><button class="btn btn-success btn-sm" onclick="toast('Approved','success')">Approve</button>
          <button class="btn btn-sm" style="background:var(--danger);color:#fff" onclick="toast('Deleted','error')">Delete</button></div>
      </div></div>`).join('') : '<p class="text-muted">No flagged reviews 🎉</p>';
  })();
</script>
</body></html>
