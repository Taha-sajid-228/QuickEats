<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My orders — QuickEats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head><body>
<div class="layout-dash">
  <div id="side"></div>
  <main class="dash-main">
    <div class="dash-head"><div><h2>My orders</h2><p class="text-muted">Track your recent orders and reorder your favorites.</p></div></div>

    <h3 class="mt-4 mb-2">Active orders</h3>
    <div id="active" class="grid grid-2"></div>

    <h3 class="mt-4 mb-2">Past orders</h3>
    <div id="past" class="grid grid-2"></div>
  </main>
</div>
<script src="/js/app.js"></script><script src="/js/panel.js"></script>
<script>
  document.getElementById('side').innerHTML = dashLayout('customer','orders');
  function orderCard(o){
    const isActive = o.status!=='Delivered';
    return `
    <div class="card"><div class="card-body">
      <div class="flex between"><strong>${o.restaurantName}</strong>
        <span class="badge ${isActive?'badge-warning':'badge-success'}">${o.status}</span></div>
      <div class="text-muted" style="font-size:0.85rem;margin:6px 0">Order #${o.id} · ${new Date(o.createdAt).toLocaleString()}</div>
      <ul style="list-style:none;padding-left:0;font-size:0.9rem;margin:10px 0">
        ${o.items.map(i=>`<li>${i.qty}× ${i.name}</li>`).join('')}
      </ul>
      <div class="flex between"><strong>${money(o.total)}</strong>
        ${isActive?'<a href="/tracking" class="btn btn-primary btn-sm">Track</a>':'<a href="/review" class="btn btn-ghost btn-sm">Rate</a>'}
      </div>
    </div></div>`;
  }
  (async()=>{
    const orders = await api('/orders');
    const active = orders.filter(o=>o.status!=='Delivered');
    const past = orders.filter(o=>o.status==='Delivered');
    document.getElementById('active').innerHTML = active.length?active.map(orderCard).join(''):'<p class="text-muted">No active orders.</p>';
    document.getElementById('past').innerHTML = past.length?past.map(orderCard).join(''):'<p class="text-muted">No past orders.</p>';
  })();
</script>
</body></html>
