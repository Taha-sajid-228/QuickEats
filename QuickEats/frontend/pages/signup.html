<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign up — QuickEats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head><body>
<div id="navbar-host"></div>
<div class="auth-wrap">
  <form class="form-card fade-in" id="signupForm">
    <h2>Create your account</h2><p class="sub">Tasty meals are just a few clicks away.</p>
    <div class="field"><label class="label">Full name</label><input class="input" id="name" required/></div>
    <div class="field"><label class="label">Email</label><input type="email" class="input" id="email" required/></div>
    <div class="field"><label class="label">Phone</label><input class="input" id="phone" required placeholder="+92 300 0000000"/></div>
    <div class="field"><label class="label">Password</label><input type="password" class="input" id="pw" required minlength="6"/></div>
    <div class="field"><label class="label">Confirm password</label><input type="password" class="input" id="pw2" required/></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
    <div class="form-foot">Already have an account? <a href="/login">Log in</a></div>
  </form>
</div>
<div id="footer-host"></div>
<script src="/js/app.js"></script>
<script>
  mountChrome("");
  document.getElementById('signupForm').addEventListener('submit', e=>{
    e.preventDefault();
    const pw = pw1.value, pw2v = pw2.value;
    if(pw!==pw2v){toast('Passwords do not match','error');return;}
    sessionStorage.setItem('qe_signup', JSON.stringify({name:name.value,email:email.value,phone:phone.value}));
    location.href='/otp';
  });
  const pw1 = document.getElementById('pw');
</script>
</body></html>
