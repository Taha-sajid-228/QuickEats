<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — QuickEats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head><body>
<div id="navbar-host"></div>
<div class="auth-wrap">
  <form class="form-card fade-in" id="loginForm">
    <h2>Welcome back 👋</h2><p class="sub">Log in to continue ordering your favorites.</p>
    <div class="field"><label class="label">Email</label><input type="email" class="input" id="email" required placeholder="you@example.com"/></div>
    <div class="field"><label class="label">Password</label><input type="password" class="input" id="password" required placeholder="••••••••"/></div>
    <div class="flex between mb-2"><label style="font-size:0.85rem"><input type="checkbox"/> Remember me</label><a href="#" style="color:var(--primary);font-size:0.85rem;font-weight:600">Forgot password?</a></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
    <div class="form-foot">New to QuickEats? <a href="/signup">Create an account</a></div>
  </form>
</div>
<div id="footer-host"></div>
<script src="/js/app.js"></script>
<script>
  mountChrome("");
  document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const email = document.getElementById('email').value;
    if(!email.includes('@')){toast('Enter a valid email','error');return;}
    
    try {
      const users = await api('/users');
      const user = users.find(u => u.email === email);
      
      if(user) {
        Auth.login(user);
        toast('Logged in!','success');
        
        let nextUrl = '/home';
        if (user.role === 'admin') nextUrl = '/admin-dashboard';
        else if (user.role === 'rider') nextUrl = '/rider-dashboard';
        else if (user.role === 'vendor') nextUrl = '/vendor-dashboard';
        
        setTimeout(()=>location.href = nextUrl, 600);
      } else {
        toast('User not found. Check credentials.', 'error');
      }
    } catch (err) {
      toast('Error logging in', 'error');
    }
  });
</script>
</body></html>
