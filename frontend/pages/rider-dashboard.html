<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rider Dashboard — QuickEats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
</head><body>
<div class="layout-dash">
  <div id="side"></div>
  <main class="dash-main">
    <div class="dash-head"><div><h2>Hi Hamza 🛵</h2><p class="text-muted">Stay safe on the roads.</p></div>
      <label class="btn btn-success">● Online</label></div>
    <div class="stats">
      <div class="stat-card"><div class="label">Today's deliveries</div><div class="value">8</div><div class="delta">+2 vs yesterday</div></div>
      <div class="stat-card"><div class="label">Earnings today</div><div class="value">$42.30</div><div class="delta">+15%</div></div>
      <div class="stat-card"><div class="label">Distance</div><div class="value">37 km</div></div>
      <div class="stat-card"><div class="label">Rating</div><div class="value">4.9 ★</div></div>
    </div>
    <h3 class="mb-2">Assigned deliveries</h3>
    <div id="list" class="grid grid-2"></div>
  </main>
</div>
<script src="/js/app.js"></script><script src="/js/panel.js"></script>
<script>
  document.getElementById('side').innerHTML = dashLayout('rider','dashboard');
  (async()=>{
    const orders = (await api('/orders')).filter(o=>o.status!=='Delivered');
    document.getElementById('list').innerHTML = orders.map(o=>`
      <div class="card"><div class="card-body">
        <div class="flex between"><strong>${o.restaurantName}</strong><span class="badge badge-warning">${o.status}</span></div>
        <p class="text-muted" style="margin:8px 0;font-size:0.9rem">📍 ${o.address}</p>
        <div class="flex between"><strong>${money(o.total)}</strong>
          <a href="/rider-delivery" class="btn btn-primary btn-sm">Open delivery →</a></div>
      </div></div>`).join('');
  })();
</script>
</body></html>
