<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Menu Management — QuickEats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
<style>.toggle{position:relative;display:inline-block;width:44px;height:24px}.toggle input{display:none}.slider{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:var(--t)}.slider::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:var(--t)}.toggle input:checked+.slider{background:var(--success)}.toggle input:checked+.slider::before{transform:translateX(20px)}</style>
</head><body>
<div class="layout-dash">
  <div id="side"></div>
  <main class="dash-main">
    <div class="dash-head"><h2>Menu management</h2></div>
    <div class="grid" style="grid-template-columns:1fr 1.4fr;gap:24px">
      <div class="card"><div class="card-body">
        <h3>Add new item</h3>
        <form id="addItem" class="mt-2">
          <div class="field"><label class="label">Image URL</label><input class="input" id="img" placeholder="https://…" oninput="document.getElementById('prev').src=this.value"/></div>
          <img id="prev" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80" style="border-radius:12px;aspect-ratio:16/10;object-fit:cover;margin-bottom:14px"/>
          <div class="field"><label class="label">Name</label><input class="input" id="iname" required/></div>
          <div class="grid grid-2">
            <div class="field"><label class="label">Price ($)</label><input type="number" class="input" id="iprice" step="0.01" required/></div>
            <div class="field"><label class="label">Category</label><input class="input" id="icat" required/></div>
          </div>
          <div class="field"><label class="label">Description</label><textarea class="input" id="idesc" rows="2"></textarea></div>
          <button class="btn btn-primary btn-block" type="submit">+ Add item</button>
        </form>
      </div></div>
      <div>
        <h3 class="mb-2">Your menu</h3>
        <div id="menu" class="grid"></div>
      </div>
    </div>
  </main>
</div>
<script src="/js/app.js"></script><script src="/js/panel.js"></script>
<script>
  document.getElementById('side').innerHTML = dashLayout('vendor','menu');
  let items = [
    {id:1,name:'Classic Cheeseburger',price:8.99,cat:'Burgers',img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80',on:true},
    {id:2,name:'BBQ Bacon Burger',price:10.49,cat:'Burgers',img:'https://images.unsplash.com/photo-1550317138-10000687a72b?w=400&q=80',on:true},
    {id:3,name:'Crispy Fries',price:3.49,cat:'Sides',img:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400&q=80',on:false},
  ];
  function render(){
    document.getElementById('menu').innerHTML = items.map(i=>`
    <div class="card"><div class="card-body">
      <div style="display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center">
        <img src="${i.img}" style="width:80px;height:80px;object-fit:cover;border-radius:12px"/>
        <div><strong>${i.name}</strong><div class="text-muted" style="font-size:0.85rem">${i.cat} · ${money(i.price)}</div>
          <div class="flex mt-2"><label class="toggle"><input type="checkbox" ${i.on?'checked':''} onchange="items.find(x=>x.id===${i.id}).on=this.checked;toast(this.checked?'Available':'Unavailable')"/><span class="slider"></span></label>
            <span class="text-muted" style="font-size:0.85rem">Available</span></div>
        </div>
        <div class="flex" style="flex-direction:column;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="alert('Edit')">Edit</button>
          <button class="btn btn-sm" style="color:var(--danger)" onclick="items=items.filter(x=>x.id!==${i.id});render()">Delete</button>
        </div>
      </div>
    </div></div>`).join('');
  }
  document.getElementById('addItem').addEventListener('submit',e=>{
    e.preventDefault();
    items.push({id:Date.now(),name:iname.value,price:+iprice.value,cat:icat.value,img:img.value||'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&q=80',on:true});
    e.target.reset(); render(); toast('Item added','success');
  });
  render();
</script>
</body></html>
